services:
  mysql:
    image: mysql:8.4
    container_name: tfg-rental-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rental_platform
    ports:
      - "3306:3306"
    volumes:
      - rental_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rental_mysql_data:
